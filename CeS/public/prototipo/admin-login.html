<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>
      Área administrativa — Núcleo Marcus Jussier
    </title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <section class="pad" style="padding:40px 24px;flex:1">
        <div class="logo">
          <span class="mark">
            <i>
            </i>
            <i>
            </i>
            <i>
            </i>
          </span>
          <span>
            <small>
              NÚCLEO DE ARTE, EDUCAÇÃO E CULTURA
            </small>
            <strong>
              Marcus Jussier
            </strong>
          </span>
        </div>
        <h1 style="margin-top:56px">
          Área administrativa
        </h1>
        <p class="muted" style="font-size:14px;line-height:1.5;margin-top:10px">
          Acesse para gerenciar atividades,
          <br>
          inscrições e participantes.
        </p>
        <form class="fields" style="margin-top:38px" action="admin-painel.html">
          <div class="field">
            <label>
              E-mail
            </label>
            <input type="email" required autocomplete="username" placeholder="seu@email.com">
          </div>
          <div class="field">
            <label>
              Senha
            </label>
            <input type="password" required autocomplete="current-password" placeholder="•••••••••">
          </div>
          <button class="button">
            Entrar
          </button>
        </form>
      </section>
      <div class="art" style="height:110px;border-radius:50% 50% 0 0">
      </div>
    </main>
  </body>
</html>
